<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idxmodify OS</title>
    <style>
        body {
            background-color: #d4d0c8; /* Classic retro desktop grey */
            font-family: "Tahoma", "Verdana", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        /* Retro Window Container */
        .window-box {
            background-color: #ece9d8;
            border: 2px outset #ffffff;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.35);
            padding: 25px 35px;
            text-align: center;
            width: 320px;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 3.5rem;
            margin: 0;
            color: #000080; /* Classic Navy Blue */
            text-shadow: 1px 1px 0px #ffffff;
            letter-spacing: -1px;
        }

        .version-tag {
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            color: #404040;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        hr.retro-hr {
            border: 0;
            border-top: 2px inset #ffffff;
            margin: 15px 0 20px 0;
        }

        .button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Web 1.0 Bevel Gradient Button */
        a.retro-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 12px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            color: #000080;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e8f5 50%, #c4d4ed 51%, #a5bce3 100%);
            border: 2px outset #ffffff;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        a.retro-btn:hover {
            background: linear-gradient(to bottom, #ffffff 0%, #fff4d0 50%, #ffe49e 51%, #ffd269 100%);
            color: #000000;
            border-color: #ffffff;
        }

        a.retro-btn:active {
            border-style: inset;
            padding: 9px 11px 7px 13px; /* Simulates physical button press */
        }

        .download-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .footer-info {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #555555;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="window-box">
        <h1>idxmodify</h1>
        <div class="version-tag">[ VERSION 1.0.0 ]</div>

        <hr class="retro-hr">

        <div class="button-list">
            <!-- Direct ISO File Download Link -->
            <a href="idxmodify-1.0.0.iso" class="retro-btn" download>
                idxmodify 1.0.0 (ISO)
            </a>
        </div>

        <div class="footer-info">
            Hosted via GitHub Pages
        </div>
    </div>

</body>
</html>
